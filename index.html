<title>課後練習與音檔庫</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
/* Layout: sticky chapter strip on top, one chapter at a time, mini player docked at the bottom */
:root{
  --paper:#F5F6F8; --card:#FFFFFF; --ink:#1C2333; --muted:#5F6878; --line:#DCE0E7;
  --accent:#2B4C7E; --accent-ink:#FFFFFF; --hi:#F2C14E; --done:#3E8E6A;
  --serif:"Noto Serif TC","Songti TC",serif; --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12161F; --card:#1B2130; --ink:#E8EBF2; --muted:#9AA3B5; --line:#2C3445;
  --accent:#8FB0E8; --accent-ink:#0F1522; --hi:#F2C14E; --done:#6CC79B; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12161F; --card:#1B2130; --ink:#E8EBF2; --muted:#9AA3B5; --line:#2C3445;
  --accent:#8FB0E8; --accent-ink:#0F1522; --hi:#F2C14E; --done:#6CC79B; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;margin:0}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header .wrap{padding-block:22px 6px}
h1{font-family:var(--serif);font-weight:900;font-size:1.7rem;margin:0;letter-spacing:.02em;text-wrap:balance}
.lead{color:var(--muted);margin:.3rem 0 0;font-size:.95rem}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
nav .wrap{padding-block:10px;display:grid;gap:6px}
.grp{display:flex;align-items:center;gap:8px;min-width:0}
.grp b{font-size:.75rem;letter-spacing:.12em;color:var(--muted);font-weight:500;flex:none;width:2.6em}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:2px;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 12px;font:500 .9rem var(--sans);cursor:pointer;font-variant-numeric:tabular-nums}
.chip[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip:focus-visible,.row:focus-visible,.q:focus-visible,.pbtn:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
main .wrap{padding-block:18px 130px}
.chhead{display:flex;align-items:baseline;gap:12px;margin:4px 0 14px}
.chno{font-family:var(--serif);font-weight:900;font-size:2.4rem;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.chtitle{font-family:var(--serif);font-weight:700;font-size:1.35rem;margin:0}
section{margin:0 0 22px}
h3{font-size:1rem;margin:0 0 8px;font-weight:700}
h3 small{display:block;font-weight:400;color:var(--muted);font-size:.85rem}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.row{position:relative;display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;cursor:pointer;overflow:hidden;min-width:0}
.row .lab{flex:1;min-width:0;font-weight:500}
.dur{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
.ico{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);position:relative}
.ico::after{content:"";position:absolute;left:11px;top:9px;border-left:10px solid var(--accent-ink);border-top:6px solid transparent;border-bottom:6px solid transparent}
.playing .ico::after{left:10px;top:10px;width:10px;height:10px;border:0;background:linear-gradient(90deg,var(--accent-ink) 0 35%,transparent 35% 65%,var(--accent-ink) 65%)}
.bar{position:absolute;left:0;bottom:0;height:3px;width:calc(var(--p,0)*100%);background:var(--hi)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.q{position:relative;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 6px 9px;font:inherit;cursor:pointer;display:grid;justify-items:center;gap:1px;overflow:hidden;min-width:0}
.q .n{font-family:var(--serif);font-weight:900;font-size:1.6rem;line-height:1.1;font-variant-numeric:tabular-nums}
.q .t{font-size:.72rem;color:var(--muted);text-align:center;line-height:1.3;min-height:1.3em}
.q.heard::before{content:"";position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--done)}
.q.playing,.row.playing{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.q.playing .n{color:var(--accent)}
.wide .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.note{font-size:.85rem;color:var(--muted);margin:-2px 0 10px}
.player{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.player .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.now{flex:1;min-width:0}
.now .t1{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now .t2{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.track{height:4px;background:var(--line);border-radius:2px;margin-top:5px;overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--accent)}
.pbtn{flex:none;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:7px 12px;font:500 .9rem var(--sans);cursor:pointer;white-space:nowrap}
.pbtn.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);min-width:64px}
.pbtn:disabled{opacity:.45;cursor:default}
.reset{margin-top:6px;background:none;border:0;color:var(--muted);font:inherit;font-size:.82rem;text-decoration:underline;cursor:pointer;padding:0}
@media (max-width:480px){.player .pbtn{padding:7px 10px}.list{grid-template-columns:1fr}}

.kbsec{margin:0 0 22px}
.kbwrap{overflow-x:auto;padding:4px 0 8px;-webkit-overflow-scrolling:touch}
.kb{position:relative;display:flex;width:max-content;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.wk{position:relative;width:46px;height:178px;border:1px solid var(--line);border-left-width:0;background:#FFFFFF;color:#1C2333;border-radius:0 0 7px 7px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:8px;font:inherit;cursor:pointer}
.wk:first-child{border-left-width:1px}
.wk .nm{font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}
.wk .so{font-size:.78rem;color:#5F6878}
.wk .tg{position:absolute;bottom:50px;left:50%;transform:translateX(-50%);font-size:.62rem;line-height:1.15;color:#FFFFFF;background:var(--accent);border-radius:4px;padding:1px 3px;white-space:nowrap}
.bk{position:absolute;top:0;width:30px;height:110px;background:#1C2333;color:#E8EBF2;border:0;border-radius:0 0 5px 5px;z-index:2;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:6px;font:inherit;font-size:.6rem;line-height:1.2;cursor:pointer}
.wk.down{background:#F2C14E}
.bk.down{background:#B88A1A}
.kbnote{font-size:.85rem;color:var(--muted);margin:4px 0 8px}
.ansbtn{margin-top:8px;background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:4px 12px;font:inherit;font-size:.85rem;cursor:pointer}
.q .a{display:none;font-size:.78rem;font-weight:700;color:var(--accent);text-align:center;line-height:1.3}
.showans .q .a{display:block}

.gate{position:fixed;inset:0;z-index:20;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.gate[hidden],.gcard[hidden]{display:none!important}
.gcard{width:100%;max-width:380px;display:grid;gap:14px;text-align:center}
.gcard h2{font-family:var(--serif);font-weight:900;font-size:1.6rem;margin:0}
.gcard p{margin:0;color:var(--muted)}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.role{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:18px 8px;font:700 1.15rem var(--sans);cursor:pointer}
.role small{display:block;font-weight:400;font-size:.8rem;color:var(--muted);margin-top:4px}
.role:focus-visible,.gbtn:focus-visible,#pw:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
#pw{font:inherit;font-size:1.1rem;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);text-align:center;letter-spacing:.2em}
.gbtn{font:700 1rem var(--sans);border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:10px 16px;cursor:pointer}
.glink{background:none;border:0;color:var(--muted);font:inherit;font-size:.9rem;text-decoration:underline;cursor:pointer}
.gerr{color:#C0392B;font-size:.9rem;min-height:1.3em}
.who{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:.85rem;color:var(--muted)}
.who b{color:var(--ink)}
.who button{background:none;border:0;padding:0;color:var(--accent);font:inherit;text-decoration:underline;cursor:pointer}
.asvg{display:none;margin-top:10px;display:none}
.showans .asvg{display:grid;gap:10px}
.asvg .it{border:1px solid var(--line);border-radius:10px;background:#FFFFFF;color:#1C2333;padding:6px 8px;overflow-x:auto}
.asvg .it b{display:block;font-size:.85rem;margin-bottom:2px}
.asvg svg{max-width:none;height:auto}
.asvg .ans{color:#C0272D}

.areas{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.area{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 6px;font:700 .95rem var(--sans);cursor:pointer}
.area[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.libnav{display:grid;gap:6px}
.libnav[hidden]{display:none}
.ver{color:var(--muted);font-size:.75rem;padding-block:0 120px;text-align:right}
main .wrap#view{padding-bottom:16px}
#sname{font:inherit;font-size:1.1rem;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);text-align:center}
.wk-list{display:grid;gap:10px}
.wcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;cursor:pointer;min-width:0}
.wcard .id{flex:none;width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700}
.wcard .tx{flex:1;min-width:0}
.wcard .tx b{display:block}
.wcard .tx small{color:var(--muted);font-size:.8rem}
.wcard .sc{flex:none;font-size:.85rem;color:var(--done);font-weight:700;font-variant-numeric:tabular-nums}
.back{background:none;border:0;color:var(--accent);font:inherit;cursor:pointer;padding:0;margin-bottom:10px;text-decoration:underline}
.run{display:grid;gap:14px}
.runhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.runhead h2{font-family:var(--serif);font-size:1.25rem;margin:0}
.prog{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent)}
.stage{position:relative;background:#FFFFFF;color:#1C2333;border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;justify-items:center;gap:6px;min-height:150px}
.stage svg{width:100%;max-width:340px;height:auto}
.stage .prompt{font-size:1.15rem;font-weight:700;text-align:center}
.stage .qtext{font-size:1.05rem;font-weight:700;text-align:center;line-height:1.5}
.tans{font-size:.85rem;color:#C0272D;font-weight:700}
.fb{position:absolute;inset:0;display:grid;place-items:center;font-size:3.2rem;font-weight:900;border-radius:14px;pointer-events:none}
.fb.ok{background:rgba(62,142,106,.18);color:#2E7D5B}
.fb.no{background:rgba(192,39,45,.14);color:#C0272D}
.pad{display:grid;gap:8px}
.keys{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.octs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.kbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 0;font:700 1.05rem var(--sans);cursor:pointer;min-width:0}
.kbtn small{display:block;font-weight:400;font-size:.72rem;color:var(--muted)}
.kbtn.sel{background:var(--hi);border-color:var(--hi);color:#1C2333}
.kbtn:focus-visible,.wcard:focus-visible,.area:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.opts{display:grid;gap:8px}
.opt{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:12px;font:500 1rem var(--sans);text-align:left;cursor:pointer}
.lbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.hl{display:grid;gap:6px}
.hl .r{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.hl .lb{font-size:.8rem;color:var(--muted)}
.bigplay{display:flex;align-items:center;gap:10px;border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:10px 20px;font:700 1rem var(--sans);cursor:pointer}
.submit{border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:10px 18px;font:700 1rem var(--sans);cursor:pointer;justify-self:center}
.submit:disabled{opacity:.45;cursor:default}
.stage.rd svg{max-width:230px}
.wstage svg{touch-action:none;cursor:crosshair;max-width:420px}
.result{display:grid;gap:12px;justify-items:center;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 14px}
.result .big{font-family:var(--serif);font-size:2.6rem;font-weight:900;color:var(--accent);line-height:1}
.result .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.result .acts button{border:1px solid var(--accent);background:var(--card);color:var(--accent);border-radius:999px;padding:8px 14px;font:700 .95rem var(--sans);cursor:pointer}
.result .acts button.main{background:var(--accent);color:var(--accent-ink)}
.sent{font-size:.8rem;color:var(--muted)}
.names{display:grid;gap:8px}
.nrow{display:flex;gap:6px}
.nbtn{flex:1;border:1px solid var(--accent);background:var(--card);color:var(--ink);border-radius:12px;padding:12px;font:700 1.1rem var(--sans);cursor:pointer}
.nx{flex:none;width:44px;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:12px;font:1.1rem var(--sans);cursor:pointer}
.nhint{font-size:.85rem}
.nhint[hidden]{display:none}
.tadmin{justify-self:start;border:1px solid #C0272D;background:var(--card);color:#C0272D;border-radius:999px;padding:6px 14px;font:700 .9rem var(--sans);cursor:pointer;margin-bottom:10px}
.wcard.hid{opacity:.55;border-style:dashed}
.atabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.atab{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;font:700 .9rem var(--sans);cursor:pointer}
.atab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.abox{display:grid;gap:10px}
.hlist{display:grid;gap:6px}
.hrow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;cursor:pointer}
.hrow input{width:20px;height:20px;accent-color:var(--accent)}
.hrow .id{width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.asel{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);max-width:100%}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pitem{border:1px solid var(--line);background:#FFFFFF;color:#1C2333;border-radius:10px;padding:8px;display:grid;gap:4px;justify-items:center;text-align:center;font-size:.9rem;min-width:0}
.pitem svg{width:100%;height:auto;max-width:150px}
.rlist{display:grid;gap:6px}
.rrow{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"t n sc" "s s s";gap:2px 10px;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer}
.rrow .rt{grid-area:t;color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.rrow .rn{grid-area:n;font-weight:700}
.rrow .rsc{grid-area:sc;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.rrow .rs{grid-area:s;font-size:.85rem;color:var(--muted)}
.rdet{overflow-x:auto}
.rdet[hidden]{display:none}
.rdet table{border-collapse:collapse;width:100%;font-size:.9rem;background:var(--card)}
.rdet th,.rdet td{border:1px solid var(--line);padding:4px 8px;text-align:center}
.rdet td.ok{color:#2E7D5B;font-weight:700}
.rdet td.no{color:#C0272D;font-weight:700}

.qimg{display:grid;justify-items:center;width:100%}
.im-bar68 .qimg svg{max-width:360px}
.explain{border:2px solid #C0272D;background:var(--card);border-radius:12px;padding:12px 14px;display:grid;gap:8px}
.explain b{color:#C0272D}
.explain .et{line-height:1.7}
.skip{justify-self:center;background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 18px;font:inherit;font-size:.9rem;cursor:pointer}
.review{display:grid;gap:6px;text-align:left;font-size:.9rem;border-top:1px solid var(--line);padding-top:8px;width:100%}
.drow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.drow .pbtn.main{flex:1;min-width:90px}
.dtans[hidden]{display:none}
.dtans{width:100%}
.qimg svg{width:100%;max-width:96px;height:auto}
.stage.mini{min-height:0}
.im-bar .qimg svg{max-width:360px}
.eqrow{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;font-weight:700;font-size:1.1rem}
.eqi svg{width:90px;height:auto}
.opts.oi{grid-template-columns:1fr 1fr}
.opt.oi{background:#FFFFFF;color:#1C2333;padding:6px;display:grid;place-items:center;min-height:84px}
.opt.oi svg{width:100%;max-width:90px;height:auto;pointer-events:none}
.opt.oi:active{background:#F2C14E}
.cnt{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cnt .col{display:grid;gap:6px;justify-items:stretch}
.cnt .col b{text-align:center;font-size:.8rem;color:var(--muted);font-weight:500}
.cnt .kbtn{font-size:1.2rem;padding:12px 0}
.guide{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;margin:0 0 12px}
.guide summary{font-weight:700;cursor:pointer}
.guide ul{margin:8px 0 0;padding-left:1.2em;color:var(--ink);font-size:.92rem}
.guide li{margin:2px 0}
.days{display:grid;gap:8px;margin-top:10px}
.day{display:grid;grid-template-columns:5.2em 1fr;gap:4px 10px;align-items:start;border-top:1px solid var(--line);padding-top:8px}
.day .dn{font-weight:700}
.day .dd{display:grid;gap:4px}
.day .ds{display:flex;gap:6px;flex-wrap:wrap}
.dchip{text-align:left;border:1px solid var(--accent);background:var(--card);color:var(--accent);border-radius:999px;padding:4px 12px;font:700 .85rem var(--sans);cursor:pointer}
.dchip.done{background:var(--done);border-color:var(--done);color:#fff}
.day .dnote{font-size:.85rem;color:var(--muted)}
.dl{display:grid;gap:3px;margin-bottom:6px}
.dlab{font-size:.78rem;color:var(--accent);letter-spacing:.1em}
.stage,.opt.oi,.dtbl,.demo .dsv,.dtans,.pitem,.asvg .it{--paper:#FFFFFF}
.bkstage{align-content:start;gap:8px;min-height:0}
.bk-track{position:relative;width:100%;height:84px;border-radius:12px;overflow:hidden;background:#FBF6F0;border:1px solid #E3D8CA;

function buildKeyboard(){
  const SOL={C:'Do',D:'Re',E:'Mi',F:'Fa',G:'Sol',A:'La',B:'Si'};
  const BL={C:['C♯','D♭'],D:['D♯','E♭'],F:['F♯','G♭'],G:['G♯','A♭'],A:['A♯','B♭']};
  const sec=document.createElement('section'); sec.className='kbsec';
  sec.innerHTML='<h3>先認識每個音的位置和聲音<small>點琴鍵就會發出聲音（C3 到 C5）。先找到參考音 A4（La），再往上、往下點，記住每個音聽起來的高低。</small></h3>';
  const row=document.createElement('div'); row.className='row'; row.style.cssText='display:flex;gap:8px;flex-wrap:wrap;margin:0 0 8px';
  const wrap=document.createElement('div'); wrap.className='kbwrap';
  const kb=document.createElement('div'); kb.className='kb'; wrap.appendChild(kb);
  const whites=[]; for(const o of [3,4]) for(const n of 'CDEFGAB') whites.push([n,o]); whites.push(['C',5]);
  const W=46;
  whites.forEach(([n,o],i)=>{
    const k=document.createElement('button'); k.type='button'; k.className='wk'; k.dataset.src='kb_'+n+o;
    k.setAttribute('aria-label',n+o+' '+SOL[n]);
    let tag=''; if(n==='C'&&o===4) tag='<span class="tg">中央C</span>'; if(n==='A'&&o===4) tag='<span class="tg">參考音</span>';
    k.innerHTML=tag+'<span class="nm">'+n+o+'</span><span class="so">'+SOL[n]+'</span>';
    kb.appendChild(k);
    if(BL[n] && !(o===5)){
      const b=document.createElement('button'); b.type='button'; b.className='bk'; b.dataset.src='kb_'+n+'s'+o;
      b.style.left=(W*(i+1)-15)+'px'; b.innerHTML=BL[n][0]+'<br>'+BL[n][1];
      b.setAttribute('aria-label',BL[n][0]+o+' 或 '+BL[n][1]+o);
      kb.appendChild(b);
    }
  });
  const pool={};
  function hit(el){
    const s=el.dataset.src; let a=pool[s];
    if(!a){a=new Audio('audio/'+s+'.mp3'); pool[s]=a;}
    try{a.pause(); a.currentTime=0;}catch(e){}
    a.play().catch(()=>{});
    el.classList.add('down'); setTimeout(()=>el.classList.remove('down'),260);
  }
  kb.addEventListener('pointerdown',e=>{const el=e.target.closest('.wk,.bk'); if(el){e.preventDefault(); hit(el);}});
  kb.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const el=e.target.closest('.wk,.bk'); if(el){e.preventDefault(); hit(el);}}});
  sec.appendChild(wrap);
  const sc=document.createElement('button'); sc.type='button'; sc.className='row'; sc.style.maxWidth='320px';
  sc.innerHTML='<span class="ico" aria-hidden="true"></span><span class="lab">從 C3 依序彈到 C5</span><span class="dur"></span><span class="bar"></span>';
  sc.onclick=()=>play('kb_scale','C3 → C5 白鍵依序','第 18 章　先認識每個音',sc);
  sec.appendChild(sc);
  const note=document.createElement('p'); note.className='kbnote'; note.textContent='手機上可以左右滑動琴鍵。黑鍵上寫的是兩種名稱，例如 C♯ 和 D♭ 是同一個鍵。';
  sec.appendChild(note);
  setTimeout(()=>{const a4=kb.querySelector('[data-src="kb_A4"]'); if(a4) wrap.scrollLeft=a4.offsetLeft-wrap.clientWidth/2+23;},0);
  return sec;
}

function fmt(s){s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}

function chips(){
  const g1=document.getElementById('g1'), g2=document.getElementById('g2');
  DATA.forEach(c=>{
    const b=document.createElement('button');
    b.className='chip'; b.type='button'; b.role='tab'; b.id='tab'+c.n;
    b.textContent='第 '+c.n+' 章'; b.title=c.title;
    b.onclick=()=>show(c.n,true);
    (c.n>=17?g1:g2).appendChild(b);
  });
}

function show(n,scroll){
  setArea('lib');
  const c=DATA.find(x=>x.n===n)||DATA.find(x=>x.n>=17);
  document.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-selected',b.id==='tab'+c.n));
  const tab=document.getElementById('tab'+c.n); tab.scrollIntoView({block:'nearest',inline:'center'});
  store.set('tab',c.n);
  const v=document.getElementById('view'); v.innerHTML='';
  const head=document.createElement('div'); head.className='chhead';
  head.innerHTML='<span class="chno">'+c.n+'</span><h2 class="chtitle"></h2>';
  head.querySelector('h2').textContent=c.title; v.appendChild(head);
  if(NOTES[c.n]){const p=document.createElement('p');p.className='note';p.textContent=NOTES[c.n];v.appendChild(p)}
  let kbDone=false;
  c.secs.forEach(s=>{
    if(c.n===18 && !kbDone && s.items[0].k==='q'){ v.appendChild(buildKeyboard()); kbDone=true; }
    const sec=document.createElement('section');
    const isQ=s.items[0].k==='q';
    const h=document.createElement('h3');
    if(isQ){const m=s.t.match(/^(練習|網頁加練)(?:（(.*)）)?$/);h.textContent=m?m[1]:'練習';if(m&&m[2]){const sm=document.createElement('small');sm.textContent=m[2];h.appendChild(sm)}}
    else h.textContent=s.t;
    sec.appendChild(h);
    const box=document.createElement('div');
    if(isQ){box.className='grid'; if(s.items.some(i=>i.tag.length>6)) sec.classList.add('wide');}
    else box.className='list';
    s.items.forEach(it=>{
      const b=document.createElement('button'); b.type='button'; b.dataset.src=it.src;
      if(it.k==='q'){
        b.className='q'+(heard[it.src]?' heard':'');
        b.innerHTML='<span class="n"></span><span class="t"></span><span class="a"></span><span class="dur"></span><span class="bar"></span>';
        if(ANS&&ANS[it.src]&&ANS[it.src].t) b.querySelector('.a').textContent=ANS[it.src].t;
        b.querySelector('.n').textContent=it.q; b.querySelector('.t').textContent=it.tag||' ';
        b.querySelector('.dur').textContent=it.dur;
        b.setAttribute('aria-label','第 '+it.q+' 題 '+(it.tag||''));
        b.onclick=()=>play(it.src,'第 '+c.n+' 章　第 '+it.q+' 題',it.tag||c.title,b);
      }else{
        b.className='row';
        b.innerHTML='<span class="ico" aria-hidden="true"></span><span class="lab"></span><span class="dur"></span><span class="bar"></span>';
        b.querySelector('.lab').textContent=it.lab; b.querySelector('.dur').textContent=it.dur;
        b.onclick=()=>play(it.src,it.lab,'第 '+c.n+' 章　'+s.t,b);
      }
      if(cur&&cur.src===it.src){cur.btn=b; if(!audio.paused) b.classList.add('playing')}
      box.appendChild(b);
    });
    sec.appendChild(box);
    if(isQ && ANS && s.items.some(i=>ANS[i.src])){
      const svgs=s.items.filter(i=>ANS[i.src]&&ANS[i.src].s&&!ANS[i.src].t);
      if(svgs.length){
        const box2=document.createElement('div'); box2.className='asvg';
        svgs.forEach(i=>{const d=document.createElement('div'); d.className='it'; d.innerHTML='<b>第 '+i.q+' 題</b>'+ANS[i.src].s; box2.appendChild(d);});
        sec.appendChild(box2);
      }
      const ab=document.createElement('button'); ab.type='button'; ab.className='ansbtn'; ab.textContent='顯示答案';
      ab.onclick=()=>{const on=sec.classList.toggle('showans'); ab.textContent=on?'隱藏答案':'顯示答案';};
      sec.appendChild(ab);
    }
    v.appendChild(sec);
  });
  if(c.secs.some(s=>s.items[0].k==='q')){
    const r=document.createElement('button');r.className='reset';r.type='button';r.textContent='清除這一章的綠點';
    r.onclick=()=>{c.secs.forEach(s=>s.items.forEach(i=>delete heard[i.src]));store.set('heard',heard);show(c.n)};
    v.appendChild(r);
  }
  if(scroll) window.scrollTo({top:0});
}

function play(src,label,sub,btn){
  if(cur&&cur.src===src){ audio.paused?audio.play():audio.pause(); return; }
  if(cur&&cur.btn){cur.btn.classList.remove('playing');cur.btn.style.removeProperty('--p')}
  cur={src,label,sub,btn};
  audio.src='audio/'+src+'.mp3'; audio.currentTime=0;
  audio.play().catch(()=>{});
  document.getElementById('nowT').textContent=label;
  document.getElementById('again').disabled=false;
  document.getElementById('toggle').disabled=false;
  if(btn&&btn.classList.contains('q')){heard[src]=1;store.set('heard',heard);btn.classList.add('heard')}
}
function sync(){
  const p=audio.duration?audio.currentTime/audio.duration:0;
  document.getElementById('nowBar').style.width=(p*100)+'%';
  document.getElementById('nowS').textContent=cur?(cur.sub+'　'+fmt(audio.currentTime)+' / '+fmt(audio.duration)):'選一題開始';
  if(cur&&cur.btn) cur.btn.style.setProperty('--p',p);
}
audio.addEventListener('timeupdate',sync);
audio.addEventListener('loadedmetadata',sync);
audio.addEventListener('play',()=>{if(cur&&cur.btn)cur.btn.classList.add('playing');document.getElementById('toggle').textContent='暫停'});
audio.addEventListener('pause',()=>{if(cur&&cur.btn)cur.btn.classList.remove('playing');document.getElementById('toggle').textContent='播放'});
audio.addEventListener('ended',()=>{if(cur&&cur.btn){cur.btn.classList.remove('playing');cur.btn.style.removeProperty('--p')}});
document.getElementById('toggle').onclick=()=>{if(cur) audio.paused?audio.play():audio.pause()};
document.getElementById('again').onclick=()=>{if(cur){audio.currentTime=0;audio.play()}};
document.getElementById('refA').onclick=()=>{play('lm_A4','參考音 A（A4，La）','先記住這個音',null)};

function b64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
async function unlock(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC.salt),iterations:ENC.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.iv)},key,b64(ENC.ct));
  return JSON.parse(new TextDecoder().decode(buf));
}
const gate=document.getElementById('gate');
function enter(role){
  gate.hidden=true;
  const nm=store.get('sname','');
  document.getElementById('whoName').textContent=role==='teacher'?'老師（可以看答案）':('學生'+(nm?'：'+nm:''));
  ROLE=role;
  if(store.get('area','week')==='lib') show(parseInt(store.get('tab',18))); else weekHome();
}
function renderNames(){
  const box=document.getElementById('nameList'); box.innerHTML='';
  const list=store.get('snames',[]);
  list.forEach(n=>{
    const row=document.createElement('div'); row.className='nrow';
    const b=document.createElement('button'); b.type='button'; b.className='nbtn'; b.textContent=n; b.onclick=()=>useName(n);
    const x=document.createElement('button'); x.type='button'; x.className='nx'; x.textContent='×'; x.setAttribute('aria-label','從這台裝置移除 '+n);
    x.onclick=()=>{store.set('snames',store.get('snames',[]).filter(y=>y!==n)); renderNames();};
    row.appendChild(b); row.appendChild(x); box.appendChild(row);
  });
  document.getElementById('nameHint').hidden=!list.length;
}
document.getElementById('asStudent').onclick=()=>{document.getElementById('gStep1').hidden=true;document.getElementById('gStepS').hidden=false;const s=document.getElementById('sname');s.value='';renderNames();if(!store.get('snames',[]).length)s.focus();};
function useName(v){
  const list=store.get('snames',[]).filter(y=>y!==v); list.unshift(v); store.set('snames',list.slice(0,8));
  store.set('sname',v); ANS=null; store.set('role','student'); enter('student');
}
function goStudent(){
  const v=document.getElementById('sname').value.trim();
  if(!v){document.getElementById('snErr').textContent='請先輸入名字，或點上面的名字。';return;}
  useName(v);
}
document.getElementById('snGo').onclick=goStudent;
document.getElementById('sname').addEventListener('keydown',e=>{if(e.key==='Enter')goStudent();});
document.getElementById('snBack').onclick=()=>{document.getElementById('gStepS').hidden=true;document.getElementById('gStep1').hidden=false;document.getElementById('snErr').textContent='';};
document.getElementById('asTeacher').onclick=()=>{document.getElementById('gStep1').hidden=true;document.getElementById('gStep2').hidden=false;document.getElementById('pw').focus();};
document.getElementById('pwBack').onclick=()=>{document.getElementById('gStep2').hidden=true;document.getElementById('gStep1').hidden=false;document.getElementById('pwErr').textContent='';};
async function tryPw(){
  const pw=document.getElementById('pw').value; const err=document.getElementById('pwErr');
  err.textContent='';
  try{ ANS=await unlock(pw); try{sessionStorage.setItem('tpw',pw)}catch(e){} store.set('role','teacher'); document.getElementById('pw').value=''; enter('teacher'); }
  catch(e){ ANS=null; err.textContent= window.crypto&&crypto.subtle ? '密碼不對，請再試一次。' : '這個瀏覽器無法驗證密碼，請換一個瀏覽器。'; }
}
document.getElementById('pwGo').onclick=tryPw;
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')tryPw();});
document.getElementById('switchRole').onclick=()=>{ANS=null; try{sessionStorage.removeItem('tpw')}catch(e){} document.getElementById('gStep2').hidden=true; document.getElementById('gStepS').hidden=true; document.getElementById('gStep1').hidden=false; gate.hidden=false;};

let ROLE = 'student';
const LETTERS='CDEFGAB';
const SOLF={C:'Do',D:'Re',E:'Mi',F:'Fa',G:'Sol',A:'La',B:'Si'};
function dOf(p){return parseInt(p.slice(-1))*7+LETTERS.indexOf(p[0]);}
function pOf(d){return LETTERS[((d%7)+7)%7]+Math.floor(d/7);}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pick(a,n){const out=[];let last=null;for(let i=0;i<n;i++){let x;let k=0;do{x=a[Math.floor(Math.random()*a.length)];k++;}while(a.length>1&&JSON.stringify(x)===JSON.stringify(last)&&k<10);out.push(x);last=x;}return out;}
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,16);}
function hlLabel(v){v=parseInt(v);return v===0?'一樣':(v<0?'比 A 低 '+(-v):'比 A 高 '+v);}

function setArea(a){
  store.set('area',a);
  document.getElementById('areaWeek').setAttribute('aria-selected',a==='week');
  document.getElementById('areaLib').setAttribute('aria-selected',a==='lib');
  document.getElementById('libNav').hidden=(a!=='lib');
}
document.getElementById('areaWeek').onclick=()=>weekHome();
document.getElementById('areaLib').onclick=()=>show(parseInt(store.get('tab',18)),true);

function scores(){return store.get('wscores',{});}
function weekHome(){
  setArea('week');
  const v=document.getElementById('view'); v.innerHTML='';
  const h=document.createElement('div'); h.className='chhead'; h.innerHTML='<h2 class="chtitle">每週課後練習</h2>'; v.appendChild(h);
  const list=document.createElement('div'); list.className='wk-list';
  WEEKS.weeks.forEach(w=>{
    const b=document.createElement('button'); b.type='button'; b.className='wcard';
    b.innerHTML='<span class="id">'+w.week+'</span><span class="tx"><b></b><small>'+w.sets.length+' 組練習</small></span>';
    b.querySelector('b').textContent=w.title;
    b.onclick=()=>weekPage(w.week); list.appendChild(b);
  });
  v.appendChild(list); window.scrollTo({top:0});
}
function weekPage(wn){
  try{audio.pause();}catch(e){}
  setArea('week');
  const w=WEEKS.weeks.find(x=>x.week===wn);
  const v=document.getElementById('view'); v.innerHTML='';
  const bk=document.createElement('button'); bk.type='button'; bk.className='back'; bk.textContent='← 回到每週列表'; bk.onclick=weekHome; v.appendChild(bk);
  if(ROLE==='teacher'){const tb=document.createElement('button');tb.type='button';tb.className='tadmin';tb.textContent='老師後台';tb.onclick=()=>adminPage(wn);v.appendChild(tb);}
  const h=document.createElement('div'); h.className='chhead'; h.innerHTML='<span class="chno">'+w.week+'</span><h2 class="chtitle"></h2>'; h.querySelector('h2').textContent=w.title.replace(/^第 \d+ 週：/,''); v.appendChild(h);
  const p=document.createElement('p'); p.className='note'; p.textContent='每一組都可以先做固定題，做完再按「隨機再練」換新題目。'; v.appendChild(p);
  if(w.guide) v.appendChild(guideBlock(w,wn));
  if(w.dash) v.appendChild(dashBlock(w));
  if(w.demos) v.appendChild(demoBlock(w,w.demos,'五種「一拍」的節奏（先聽、念、拍）'));
  if(w.six8) v.appendChild(six8Block(w));
  if(w.demos68) v.appendChild(demoBlock(w,w.demos68,'6/8 拍的「一拍」節奏（先聽、念、拍）'));
  const list=document.createElement('div'); list.className='wk-list';
  v.appendChild(list);
  const sc=scores();
  w.sets.forEach(s=>{
    const hid=HIDDEN.includes(wn+s.id);
    if(hid && ROLE!=='teacher') return;
    const b=document.createElement('button'); b.type='button'; b.className='wcard'+(hid?' hid':'');
    const r=sc[wn+s.id];
    b.innerHTML='<span class="id">'+s.id+'</span><span class="tx"><b></b><small>'+s.n+' 題'+(hid?'・學生看不到':'')+'</small></span><span class="sc">'+(r?r.score+'/'+r.total:'')+'</span>';
    b.querySelector('b').textContent=s.title;
    b.onclick=()=>startSet(wn,s,'fixed'); list.appendChild(b);
  });
  v.appendChild(list); window.scrollTo({top:0});
}

const TK=()=>WEEKS.toks;

function fbl(b){const w=Math.floor(b+1e-9),f=Math.round((b-w)*4)/4;const m={0:'',0.25:'¼',0.5:'½',0.75:'¾'};return (w===0?'':String(w))+m[f]+' 拍';}

function whyTok(t){const T=TK(),o=T[t];
  if(o.k==='rest'&&!t.endsWith('.')) return '休止符的長度和同名的音符一樣，只是沒有聲音：'+o.n+'是 '+fbl(o.b)+'。';

function genBucket(n){

function genTok(kind,n){

function buildQs(s,mode,only){

    } else if(s.type==='write'){

      }

  }
  return qs;
}

function startTimer(){ if(RUN.timer) return; RUN.timer=setInterval(()=>{const el=document.getElementById('tmr'); if(el) el.textContent=Math.floor((Date.now()-RUN.t0)/1000)+' 秒';},250); }
function stopTimer(){ if(RUN&&RUN.timer){clearInterval(RUN.timer);RUN.timer=null;} }
function finish(){
  stopTimer();
  const {s,qs,wn}=RUN; const total=qs.length, sc=RUN.right.length, secs=Math.round((Date.now()-RUN.t0)/1000);
  const wrongNums=RUN.wrongNums||[];
  if(RUN.mode==='fixed'){const all=scores(); all[wn+s.id]={score:sc,total,at:Date.now()}; store.set('wscores',all);}
  const v=document.getElementById('view'); v.innerHTML='';
  const r=document.createElement('div'); r.className='result';
  r.innerHTML='<div>'+s.id+'. </div><div class="big">'+sc+' / '+total+'</div><div>用時 '+secs+' 秒</div>';
  r.firstChild.textContent=s.id+'. '+s.title+(RUN.mode==='random'?'（隨機）':RUN.mode==='retry'?'（錯題再練）':'');
  const msg=document.createElement('div');
  msg.textContent= sc===total ? '全部答對！' : ('答錯的題號：'+wrongNums.join('、'));
  r.appendChild(msg);
  if(RUN.review&&RUN.review.length){const rv=document.createElement('div'); rv.className='review'; const hd=document.createElement('b'); hd.textContent='答錯的題目：'; rv.appendChild(hd);
    RUN.review.forEach(x=>{const d=document.createElement('div'); d.textContent='第 '+x.n+' 題　'+(x.q.exp||(x.q.ans!=null?'正確答案：'+showAns(s,x.q.ans):'')); rv.appendChild(d);}); r.appendChild(rv);}
  if(s.timed){const gl=s.goal||{secs:60,wrong:2}; const lab=(gl.secs%60===0?(gl.secs/60)+' 分鐘':gl.secs+' 秒')+'內完成、錯 '+gl.wrong+' 題以內'; const g=document.createElement('div'); g.textContent=(secs<=gl.secs&&total-sc<=gl.wrong)?'達成目標：'+lab+'！':'目標：'+lab+'。'; r.appendChild(g);}
  const acts=document.createElement('div'); acts.className='acts';
  const mk=(txt,fn,main)=>{const b=document.createElement('button');b.type='button';b.textContent=txt;if(main)b.className='main';b.onclick=fn;acts.appendChild(b);};
  if(RUN.wrong.length && RUN.mode!=='random') mk('錯題再練',()=>startSet(wn,s,'retry',RUN.wrong.slice()),true);
  mk('隨機再練',()=>startSet(wn,s,'random'),!RUN.wrong.length||RUN.mode==='random');
  mk('回到這週的練習',()=>weekPage(wn));
  r.appendChild(acts);
  const sent=document.createElement('div'); sent.className='sent'; r.appendChild(sent);
  v.appendChild(r); window.scrollTo({top:0});
  if(ROLE==='student') report({type:'result',id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),details:RUN.log,name:store.get('sname',''),week:wn,set:s.id+'. '+s.title,mode:RUN.mode==='fixed'?'固定題':RUN.mode==='random'?'隨機':'錯題再練',score:sc,total,seconds:secs,wrong:wrongNums.join('、'),time:new Date().toLocaleString('zh-TW')},sent);
}

async function flush(el){
  if(!SHEET_URL) return;

  try{
    for(const row of q){ await fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(row)}); }

      box.appendChild(sel);
      const body=document.createElement('div'); body.className='abox'; box.appendChild(body);
      const fmtT=v=>{const t=new Date(v); return isNaN(t)?String(v):(t.getMonth()+1)+'/'+t.getDate()+' '+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');};
      const draw=()=>{
        body.innerHTML=''; const who=sel.value;
        const mine=recs.filter(r=>String(r[1])===who);
        // ---- 完成情況
        const missing=[]; let doneN=0, totalN=0;
        let h='<table><thead><tr><th>題組</th><th>狀態</th><th>最近成績</th><th>次數</th></tr></thead><tbody>';
        w.sets.forEach(x=>{
          const hid=HIDDEN.includes(wn+x.id);
          const rs=mine.filter(r=>String(r[3]).split('.')[0]===x.id);
          const fx=rs.filter(r=>r[4]==='固定題'||String(r[4]).indexOf('紙上')===0);
          let status, cls, sc='';
          if(!rs.length){status='未做'; cls='miss'; if(!hid) missing.push(x.id);}
          else if(!fx.length){status='只做了隨機／錯題再練'; cls='part';}
          else {status='已做'; cls='done';}
          if(!hid){totalN++; if(rs.length) doneN++;}
          const last=rs.length?(fx.length?fx[fx.length-1]:rs[rs.length-1]):null;
          if(last){const ok=Number(last[5]), tt=Number(last[6]); sc=last[5]+'/'+last[6]+(tt&&ok/tt<0.7?' ⚠':'');}
          h+='<tr class="'+cls+(hid?' hid':'')+'"><td class="l">'+x.id+'. '+x.title+(hid?'（學生看不到）':'')+'</td><td>'+status+'</td><td>'+sc+'</td><td>'+(rs.length||'')+'</td></tr>';
        });
        h+='</tbody></table>';
        const sum=document.createElement('p'); sum.className='note';
        sum.innerHTML='<b></b>';
        sum.querySelector('b').textContent=who+'：已做 '+doneN+' / '+totalN+' 組';
        if(missing.length){const m=document.createElement('span'); m.className='rmiss'; m.textContent='　未做：'+missing.join('、'); sum.appendChild(m);}
        else if(totalN){sum.appendChild(document.createTextNode('　全部都做了'));}
        body.appendChild(sum);
        const comp=document.createElement('div'); comp.className='rcomp'; comp.innerHTML=h; body.appendChild(comp);
        const tn=document.createElement('p'); tn.className='note'; tn.textContent='⚠ 表示最近一次正確率不到 70%。紙上聽寫是學生自己勾選，不一定代表寫對。';
        body.appendChild(tn);
        // ---- 作答紀錄
        const hd=document.createElement('p'); hd.className='note'; hd.textContent='作答紀錄（點一下看每一題的題目和答案）：'; body.appendChild(hd);
        const list=document.createElement('div'); list.className='rlist'; body.appendChild(list);
        mine.slice().reverse().forEach(r=>{
          const b=document.createElement('button'); b.type='button'; b.className='rrow';
          b.innerHTML='<span class="rt"></span><span class="rn"></span><span class="rs"></span><span class="rsc"></span>';
          b.querySelector('.rt').textContent=fmtT(r[0]); b.querySelector('.rn').textContent=r[1]; b.querySelector('.rs').textContent=r[3]+'（'+r[4]+'）'; b.querySelector('.rsc').textContent=r[5]+'/'+r[6];
          const panel=document.createElement('div'); panel.className='rdet'; panel.hidden=true;
          b.onclick=()=>{
            panel.hidden=!panel.hidden; if(panel.dataset.done) return; panel.dataset.done=1;
            const rows=det[r[10]]||[];
            const sid=String(r[3]).split('.')[0]; const x=w.sets.find(y=>y.id===sid);
            if(!rows.length){panel.textContent=String(r[4]).indexOf('紙上')===0?'紙上聽寫：學生自己勾選，沒有逐題紀錄。':'這次作答沒有逐題紀錄（舊版網頁送出的成績）。';return;}
            const nWrong=rows.filter(y=>y[7]!=='○').length;
            const bar=document.createElement('label'); bar.className='rfil';
            bar.innerHTML='<input type="checkbox"><span></span>'; bar.querySelector('span').textContent='只看答錯的（共 '+nWrong+' 題）';
            panel.appendChild(bar);
            const grid=document.createElement('div'); grid.className='rgrid'; panel.appendChild(grid);
            const cb=bar.querySelector('input'); cb.checked=nWrong>0; grid.classList.toggle('onlywrong',cb.checked); cb.onchange=()=>grid.classList.toggle('onlywrong',cb.checked);
            rows.forEach(y=>{
              const idx=y[10]; let item=null, qd=null;
              if(y[11]){try{qd=JSON.parse(y[11]);}catch(e){}}
              if(x&&idx!==''&&idx!=null&&x.items[parseInt(idx)]) item=x.items[parseInt(idx)];
              if(!item) item=qd||{};
              const corr=y[8]!==''&&y[8]!=null?String(y[8]):((idx!==''&&idx!=null)?String(ansOf(sid,parseInt(idx))||''):'');
              const val=String(y[6]);
              const c=document.createElement('div'); c.className='pitem rq '+(y[7]==='○'?'ok':'no');
              const t=document.createElement('b'); t.className=(y[7]==='○'?'ok':'no'); t.textContent='第 '+y[5]+' 題　'+y[7]; c.appendChild(t);
              c.appendChild(qPrev(x,item,val,corr,qd&&qd.pl));
              const an=document.createElement('div'); an.className='rans';
              if(x&&x.type==='bucket'&&val!=='跳過') an.textContent='學生放了 '+val+' 拍（正確是 4 拍）';
              else if(val==='跳過') an.textContent='學生：跳過'+(corr?'　正確：'+(x?showAns(x,corr):corr):'');
              else an.textContent='學生：'+(x?showAns(x,val):val)+(y[7]!=='○'&&corr?'　正確：'+(x?showAns(x,corr):corr):'');
              c.appendChild(an); grid.appendChild(c);
            });
          };
          list.appendChild(b); list.appendChild(panel);
        });
      };
      sel.onchange=draw; draw();
    }).catch(()=>{st.textContent='讀取失敗，請確認網路和試算表設定。';});
  }
  window.scrollTo({top:0});
}
loadConfig();

chips();

const want=parseInt(hashCh||store.get('tab',18));
store.set('tab',want); if(hashCh) store.set('area','lib');

  let pw=null; try{pw=sessionStorage.getItem('tpw')}catch(e){}
  if(pw){ try{ ANS=await unlock(pw); enter('teacher'); return; }catch(e){} }
  weekHome();
})();
</script>
