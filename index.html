<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>音樂班聽力練習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
/* Layout: sticky chapter strip on top, one chapter at a time, mini player docked at the bottom */
:root{
  --paper:#F5F6F8; --card:#FFFFFF; --ink:#1C2333; --muted:#5F6878; --line:#DCE0E7;
  --accent:#2B4C7E; --accent-ink:#FFFFFF; --hi:#F2C14E; --done:#3E8E6A;
  --serif:"Noto Serif TC","Songti TC",serif; --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12161F; --card:#1B2130; --ink:#E8EBF2; --muted:#9AA3B5; --line:#2C3445;
  --accent:#8FB0E8; --accent-ink:#0F1522; --hi:#F2C14E; --done:#6CC79B; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12161F; --card:#1B2130; --ink:#E8EBF2; --muted:#9AA3B5; --line:#2C3445;
  --accent:#8FB0E8; --accent-ink:#0F1522; --hi:#F2C14E; --done:#6CC79B; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;margin:0}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header .wrap{padding-block:22px 6px}
h1{font-family:var(--serif);font-weight:900;font-size:1.7rem;margin:0;letter-spacing:.02em;text-wrap:balance}
.lead{color:var(--muted);margin:.3rem 0 0;font-size:.95rem}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
nav .wrap{padding-block:10px;display:grid;gap:6px}
.grp{display:flex;align-items:center;gap:8px;min-width:0}
.grp b{font-size:.75rem;letter-spacing:.12em;color:var(--muted);font-weight:500;flex:none;width:2.6em}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:2px;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 12px;font:500 .9rem var(--sans);cursor:pointer;font-variant-numeric:tabular-nums}
.chip[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip:focus-visible,.row:focus-visible,.q:focus-visible,.pbtn:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
main .wrap{padding-block:18px 130px}
.chhead{display:flex;align-items:baseline;gap:12px;margin:4px 0 14px}
.chno{font-family:var(--serif);font-weight:900;font-size:2.4rem;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.chtitle{font-family:var(--serif);font-weight:700;font-size:1.35rem;margin:0}
section{margin:0 0 22px}
h3{font-size:1rem;margin:0 0 8px;font-weight:700}
h3 small{display:block;font-weight:400;color:var(--muted);font-size:.85rem}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.row{position:relative;display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;cursor:pointer;overflow:hidden;min-width:0}
.row .lab{flex:1;min-width:0;font-weight:500}
.dur{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
.ico{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);position:relative}
.ico::after{content:"";position:absolute;left:11px;top:9px;border-left:10px solid var(--accent-ink);border-top:6px solid transparent;border-bottom:6px solid transparent}
.playing .ico::after{left:10px;top:10px;width:10px;height:10px;border:0;background:linear-gradient(90deg,var(--accent-ink) 0 35%,transparent 35% 65%,var(--accent-ink) 65%)}
.bar{position:absolute;left:0;bottom:0;height:3px;width:calc(var(--p,0)*100%);background:var(--hi)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.q{position:relative;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 6px 9px;font:inherit;cursor:pointer;display:grid;justify-items:center;gap:1px;overflow:hidden;min-width:0}
.q .n{font-family:var(--serif);font-weight:900;font-size:1.6rem;line-height:1.1;font-variant-numeric:tabular-nums}
.q .t{font-size:.72rem;color:var(--muted);text-align:center;line-height:1.3;min-height:1.3em}
.q.heard::before{content:"";position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--done)}
.q.playing,.row.playing{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.q.playing .n{color:var(--accent)}
.wide .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.note{font-size:.85rem;color:var(--muted);margin:-2px 0 10px}
.player{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.player .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.now{flex:1;min-width:0}
.now .t1{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now .t2{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.track{height:4px;background:var(--line);border-radius:2px;margin-top:5px;overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--accent)}
.pbtn{flex:none;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:7px 12px;font:500 .9rem var(--sans);cursor:pointer;white-space:nowrap}
.pbtn.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);min-width:64px}
.pbtn:disabled{opacity:.45;cursor:default}
.reset{margin-top:6px;background:none;border:0;color:var(--muted);font:inherit;font-size:.82rem;text-decoration:underline;cursor:pointer;padding:0}
@media (max-width:480px){.player .pbtn{padding:7px 10px}.list{grid-template-columns:1fr}}

.kbsec{margin:0 0 22px}
.kbwrap{overflow-x:auto;padding:4px 0 8px;-webkit-overflow-scrolling:touch}
.kb{position:relative;display:flex;width:max-content;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.wk{position:relative;width:46px;height:178px;border:1px solid var(--line);border-left-width:0;background:#FFFFFF;color:#1C2333;border-radius:0 0 7px 7px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:8px;font:inherit;cursor:pointer}
.wk:first-child{border-left-width:1px}
.wk .nm{font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}
.wk .so{font-size:.78rem;color:#5F6878}
.wk .tg{position:absolute;bottom:50px;left:50%;transform:translateX(-50%);font-size:.62rem;line-height:1.15;color:#FFFFFF;background:var(--accent);border-radius:4px;padding:1px 3px;white-space:nowrap}
.bk{position:absolute;top:0;width:30px;height:110px;background:#1C2333;color:#E8EBF2;border:0;border-radius:0 0 5px 5px;z-index:2;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:6px;font:inherit;font-size:.6rem;line-height:1.2;cursor:pointer}
.wk.down{background:#F2C14E}
.bk.down{background:#B88A1A}
.kbnote{font-size:.85rem;color:var(--muted);margin:4px 0 8px}
.ansbtn{margin-top:8px;background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:4px 12px;font:inherit;font-size:.85rem;cursor:pointer}
.q .a{display:none;font-size:.78rem;font-weight:700;color:var(--accent);text-align:center;line-height:1.3}
.showans .q .a{display:block}

.gate{position:fixed;inset:0;z-index:20;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.gate[hidden],.gcard[hidden]{display:none!important}
.gcard{width:100%;max-width:380px;display:grid;gap:14px;text-align:center}
.gcard h2{font-family:var(--serif);font-weight:900;font-size:1.6rem;margin:0}
.gcard p{margin:0;color:var(--muted)}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.role{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:18px 8px;font:700 1.15rem var(--sans);cursor:pointer}
.role small{display:block;font-weight:400;font-size:.8rem;color:var(--muted);margin-top:4px}
.role:focus-visible,.gbtn:focus-visible,#pw:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
#pw{font:inherit;font-size:1.1rem;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);text-align:center;letter-spacing:.2em}
.gbtn{font:700 1rem var(--sans);border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:10px 16px;cursor:pointer}
.glink{background:none;border:0;color:var(--muted);font:inherit;font-size:.9rem;text-decoration:underline;cursor:pointer}
.gerr{color:#C0392B;font-size:.9rem;min-height:1.3em}
.who{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:.85rem;color:var(--muted)}
.who b{color:var(--ink)}
.who button{background:none;border:0;padding:0;color:var(--accent);font:inherit;text-decoration:underline;cursor:pointer}
.asvg{display:none;margin-top:10px;display:none}
.showans .asvg{display:grid;gap:10px}
.asvg .it{border:1px solid var(--line);border-radius:10px;background:#FFFFFF;color:#1C2333;padding:6px 8px;overflow-x:auto}
.asvg .it b{display:block;font-size:.85rem;margin-bottom:2px}
.asvg svg{max-width:none;height:auto}
.asvg .ans{color:#C0272D}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<header><div class="wrap">
  <h1>音樂班聽力練習</h1>
  <p class="lead">翻到講義的章節和題號，按下同一個號碼播放。每題可以重複聽；聽過的題目右上角會出現綠點。</p>
  <div class="who">目前身份：<b id="whoName">學生</b><button type="button" id="switchRole">切換身份</button></div>
</div></header>
<nav><div class="wrap">
  <div class="grp"><b>聽寫</b><div class="chips" id="g1" role="tablist" aria-label="聽寫章節"></div></div>
  <div class="grp"><b>樂理</b><div class="chips" id="g2" role="tablist" aria-label="樂理示範章節"></div></div>
</div></nav>
<main><div class="wrap" id="view"></div></main>
<div class="player"><div class="wrap">
  <div class="now"><div class="t1" id="nowT">還沒播放</div><div class="t2" id="nowS">選一題開始</div><div class="track"><i id="nowBar"></i></div></div>
  <button class="pbtn" id="refA" type="button">參考音 A</button>
  <button class="pbtn" id="again" type="button" disabled>重聽</button>
  <button class="pbtn main" id="toggle" type="button" disabled>播放</button>
</div></div>

<div class="gate" id="gate" role="dialog" aria-modal="true" aria-labelledby="gTitle">
  <div class="gcard" id="gStep1">
    <h2 id="gTitle">音樂班聽力練習</h2>
    <p>請選擇你的身份</p>
    <div class="roles">
      <button class="role" type="button" id="asStudent">學生<small>直接進入練習</small></button>
      <button class="role" type="button" id="asTeacher">老師<small>需要輸入密碼</small></button>
    </div>
  </div>
  <div class="gcard" id="gStep2" hidden>
    <h2>老師登入</h2>
    <p>輸入密碼後可以看到練習的答案</p>
    <input id="pw" type="password" inputmode="numeric" autocomplete="current-password" aria-label="老師密碼" placeholder="密碼">
    <button class="gbtn" type="button" id="pwGo">進入</button>
    <div class="gerr" id="pwErr" aria-live="polite"></div>
    <button class="glink" type="button" id="pwBack">返回</button>
  </div>
</div>
<script>

let ANS = null; // decrypted answers, teacher only
const NOTES = {
  3:'第 1–8 題和第 13 題有音檔，其他題目看講義作答。',
  18:'忘記 A 的聲音時，隨時按下方的「參考音 A」。'
};
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let heard = store.get('heard',{});
const audio = new Audio(); audio.preload='none';
let cur = null; // {src, label, sub, btn}


function buildKeyboard(){
  const SOL={C:'Do',D:'Re',E:'Mi',F:'Fa',G:'Sol',A:'La',B:'Si'};
  const BL={C:['C♯','D♭'],D:['D♯','E♭'],F:['F♯','G♭'],G:['G♯','A♭'],A:['A♯','B♭']};
  const sec=document.createElement('section'); sec.className='kbsec';
  sec.innerHTML='<h3>先認識每個音的位置和聲音<small>點琴鍵就會發出聲音（C3 到 C5）。先找到參考音 A4（La），再往上、往下點，記住每個音聽起來的高低。</small></h3>';
  const row=document.createElement('div'); row.className='row'; row.style.cssText='display:flex;gap:8px;flex-wrap:wrap;margin:0 0 8px';
  const wrap=document.createElement('div'); wrap.className='kbwrap';
  const kb=document.createElement('div'); kb.className='kb'; wrap.appendChild(kb);
  const whites=[]; for(const o of [3,4]) for(const n of 'CDEFGAB') whites.push([n,o]); whites.push(['C',5]);
  const W=46;
  whites.forEach(([n,o],i)=>{
    const k=document.createElement('button'); k.type='button'; k.className='wk'; k.dataset.src='kb_'+n+o;
    k.setAttribute('aria-label',n+o+' '+SOL[n]);
    let tag=''; if(n==='C'&&o===4) tag='<span class="tg">中央C</span>'; if(n==='A'&&o===4) tag='<span class="tg">參考音</span>';
    k.innerHTML=tag+'<span class="nm">'+n+o+'</span><span class="so">'+SOL[n]+'</span>';
    kb.appendChild(k);
    if(BL[n] && !(o===5)){
      const b=document.createElement('button'); b.type='button'; b.className='bk'; b.dataset.src='kb_'+n+'s'+o;
      b.style.left=(W*(i+1)-15)+'px'; b.innerHTML=BL[n][0]+'<br>'+BL[n][1];
      b.setAttribute('aria-label',BL[n][0]+o+' 或 '+BL[n][1]+o);
      kb.appendChild(b);
    }
  });
  const pool={};
  function hit(el){
    const s=el.dataset.src; let a=pool[s];
    if(!a){a=new Audio('audio/'+s+'.mp3'); pool[s]=a;}
    try{a.pause(); a.currentTime=0;}catch(e){}
    a.play().catch(()=>{});
    el.classList.add('down'); setTimeout(()=>el.classList.remove('down'),260);
  }
  kb.addEventListener('pointerdown',e=>{const el=e.target.closest('.wk,.bk'); if(el){e.preventDefault(); hit(el);}});
  kb.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const el=e.target.closest('.wk,.bk'); if(el){e.preventDefault(); hit(el);}}});
  sec.appendChild(wrap);
  const sc=document.createElement('button'); sc.type='button'; sc.className='row'; sc.style.maxWidth='320px';
  sc.innerHTML='<span class="ico" aria-hidden="true"></span><span class="lab">從 C3 依序彈到 C5</span><span class="dur"></span><span class="bar"></span>';
  sc.onclick=()=>play('kb_scale','C3 → C5 白鍵依序','第 18 章　先認識每個音',sc);
  sec.appendChild(sc);
  const note=document.createElement('p'); note.className='kbnote'; note.textContent='手機上可以左右滑動琴鍵。黑鍵上寫的是兩種名稱，例如 C♯ 和 D♭ 是同一個鍵。';
  sec.appendChild(note);
  setTimeout(()=>{const a4=kb.querySelector('[data-src="kb_A4"]'); if(a4) wrap.scrollLeft=a4.offsetLeft-wrap.clientWidth/2+23;},0);
  return sec;
}

function fmt(s){s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}

function chips(){
  const g1=document.getElementById('g1'), g2=document.getElementById('g2');
  DATA.forEach(c=>{
    const b=document.createElement('button');
    b.className='chip'; b.type='button'; b.role='tab'; b.id='tab'+c.n;
    b.textContent='第 '+c.n+' 章'; b.title=c.title;
    b.onclick=()=>show(c.n,true);
    (c.n>=17?g1:g2).appendChild(b);
  });
}

function show(n,scroll){
  const c=DATA.find(x=>x.n===n)||DATA.find(x=>x.n>=17);
  document.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-selected',b.id==='tab'+c.n));
  const tab=document.getElementById('tab'+c.n); tab.scrollIntoView({block:'nearest',inline:'center'});
  store.set('tab',c.n);
  const v=document.getElementById('view'); v.innerHTML='';
  const head=document.createElement('div'); head.className='chhead';
  head.innerHTML='<span class="chno">'+c.n+'</span><h2 class="chtitle"></h2>';
  head.querySelector('h2').textContent=c.title; v.appendChild(head);
  if(NOTES[c.n]){const p=document.createElement('p');p.className='note';p.textContent=NOTES[c.n];v.appendChild(p)}
  let kbDone=false;
  c.secs.forEach(s=>{
    if(c.n===18 && !kbDone && s.items[0].k==='q'){ v.appendChild(buildKeyboard()); kbDone=true; }
    const sec=document.createElement('section');
    const isQ=s.items[0].k==='q';
    const h=document.createElement('h3');
    if(isQ){const m=s.t.match(/^(練習|網頁加練)(?:（(.*)）)?$/);h.textContent=m?m[1]:'練習';if(m&&m[2]){const sm=document.createElement('small');sm.textContent=m[2];h.appendChild(sm)}}
    else h.textContent=s.t;
    sec.appendChild(h);
    const box=document.createElement('div');
    if(isQ){box.className='grid'; if(s.items.some(i=>i.tag.length>6)) sec.classList.add('wide');}
    else box.className='list';
    s.items.forEach(it=>{
      const b=document.createElement('button'); b.type='button'; b.dataset.src=it.src;
      if(it.k==='q'){
        b.className='q'+(heard[it.src]?' heard':'');
        b.innerHTML='<span class="n"></span><span class="t"></span><span class="a"></span><span class="dur"></span><span class="bar"></span>';
        if(ANS&&ANS[it.src]&&ANS[it.src].t) b.querySelector('.a').textContent=ANS[it.src].t;
        b.querySelector('.n').textContent=it.q; b.querySelector('.t').textContent=it.tag||' ';
        b.querySelector('.dur').textContent=it.dur;
        b.setAttribute('aria-label','第 '+it.q+' 題 '+(it.tag||''));
        b.onclick=()=>play(it.src,'第 '+c.n+' 章　第 '+it.q+' 題',it.tag||c.title,b);
      }else{
        b.className='row';
        b.innerHTML='<span class="ico" aria-hidden="true"></span><span class="lab"></span><span class="dur"></span><span class="bar"></span>';
        b.querySelector('.lab').textContent=it.lab; b.querySelector('.dur').textContent=it.dur;
        b.onclick=()=>play(it.src,it.lab,'第 '+c.n+' 章　'+s.t,b);
      }
      if(cur&&cur.src===it.src){cur.btn=b; if(!audio.paused) b.classList.add('playing')}
      box.appendChild(b);
    });
    sec.appendChild(box);
    if(isQ && ANS && s.items.some(i=>ANS[i.src])){
      const svgs=s.items.filter(i=>ANS[i.src]&&ANS[i.src].s&&!ANS[i.src].t);
      if(svgs.length){
        const box2=document.createElement('div'); box2.className='asvg';
        svgs.forEach(i=>{const d=document.createElement('div'); d.className='it'; d.innerHTML='<b>第 '+i.q+' 題</b>'+ANS[i.src].s; box2.appendChild(d);});
        sec.appendChild(box2);
      }
      const ab=document.createElement('button'); ab.type='button'; ab.className='ansbtn'; ab.textContent='顯示答案';
      ab.onclick=()=>{const on=sec.classList.toggle('showans'); ab.textContent=on?'隱藏答案':'顯示答案';};
      sec.appendChild(ab);
    }
    v.appendChild(sec);
  });
  if(c.secs.some(s=>s.items[0].k==='q')){
    const r=document.createElement('button');r.className='reset';r.type='button';r.textContent='清除這一章的綠點';
    r.onclick=()=>{c.secs.forEach(s=>s.items.forEach(i=>delete heard[i.src]));store.set('heard',heard);show(c.n)};
    v.appendChild(r);
  }
  if(scroll) window.scrollTo({top:0});
}

function play(src,label,sub,btn){
  if(cur&&cur.src===src){ audio.paused?audio.play():audio.pause(); return; }
  if(cur&&cur.btn){cur.btn.classList.remove('playing');cur.btn.style.removeProperty('--p')}
  cur={src,label,sub,btn};
  audio.src='audio/'+src+'.mp3'; audio.currentTime=0;
  audio.play().catch(()=>{});
  document.getElementById('nowT').textContent=label;
  document.getElementById('again').disabled=false;
  document.getElementById('toggle').disabled=false;
  if(btn&&btn.classList.contains('q')){heard[src]=1;store.set('heard',heard);btn.classList.add('heard')}
}
function sync(){
  const p=audio.duration?audio.currentTime/audio.duration:0;
  document.getElementById('nowBar').style.width=(p*100)+'%';
  document.getElementById('nowS').textContent=cur?(cur.sub+'　'+fmt(audio.currentTime)+' / '+fmt(audio.duration)):'選一題開始';
  if(cur&&cur.btn) cur.btn.style.setProperty('--p',p);
}
audio.addEventListener('timeupdate',sync);
audio.addEventListener('loadedmetadata',sync);
audio.addEventListener('play',()=>{if(cur&&cur.btn)cur.btn.classList.add('playing');document.getElementById('toggle').textContent='暫停'});
audio.addEventListener('pause',()=>{if(cur&&cur.btn)cur.btn.classList.remove('playing');document.getElementById('toggle').textContent='播放'});
audio.addEventListener('ended',()=>{if(cur&&cur.btn){cur.btn.classList.remove('playing');cur.btn.style.removeProperty('--p')}});
document.getElementById('toggle').onclick=()=>{if(cur) audio.paused?audio.play():audio.pause()};
document.getElementById('again').onclick=()=>{if(cur){audio.currentTime=0;audio.play()}};
document.getElementById('refA').onclick=()=>{play('lm_A4','參考音 A（A4，La）','先記住這個音',null)};

function b64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
async function unlock(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(ENC.salt),iterations:ENC.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(ENC.iv)},key,b64(ENC.ct));
  return JSON.parse(new TextDecoder().decode(buf));
}
const gate=document.getElementById('gate');
function enter(role){
  gate.hidden=true;
  document.getElementById('whoName').textContent=role==='teacher'?'老師（可以看答案）':'學生';
  show(parseInt(store.get('tab',18)));
}
document.getElementById('asStudent').onclick=()=>{ANS=null; store.set('role','student'); enter('student');};
document.getElementById('asTeacher').onclick=()=>{document.getElementById('gStep1').hidden=true;document.getElementById('gStep2').hidden=false;document.getElementById('pw').focus();};
document.getElementById('pwBack').onclick=()=>{document.getElementById('gStep2').hidden=true;document.getElementById('gStep1').hidden=false;document.getElementById('pwErr').textContent='';};
async function tryPw(){
  const pw=document.getElementById('pw').value; const err=document.getElementById('pwErr');
  err.textContent='';
  try{ ANS=await unlock(pw); try{sessionStorage.setItem('tpw',pw)}catch(e){} store.set('role','teacher'); document.getElementById('pw').value=''; enter('teacher'); }
  catch(e){ ANS=null; err.textContent= window.crypto&&crypto.subtle ? '密碼不對，請再試一次。' : '這個瀏覽器無法驗證密碼，請換一個瀏覽器。'; }
}
